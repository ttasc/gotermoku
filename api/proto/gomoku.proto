// api/proto/gomoku.proto
syntax = "proto3";
package pb;
option go_package = "github.com/ttasc/gotermoku/internal/common/pb";

// ==========================================
// CORE GAME MODELS (Dùng chung cho LAN & Server)
// ==========================================

message BoardRow {
    bytes cells = 1; // bytes ánh xạ 1-1 với []uint8 trong Go
}

message Position {
    int32 x = 1;
    int32 y = 2;
}

// Client -> Host / Server
message ClientAction {
    string type = 1; // "move" hoặc "restart"
    int32 x = 2;
    int32 y = 3;
}

// Host / Server -> Client (Đồng bộ GameState)
message GameSync {
    string type = 1; // "sync", "disconnect", "pause", "resume", "error"
    int32 current_turn = 2;
    int32 winner = 3; // 0: Empty, 1: White, 2: Black, 3: Draw
    repeated BoardRow board = 4;
    repeated Position winning_positions = 5;
    string message = 6;
    bool is_paused = 7;                 // Trận đấu đang tạm dừng (chờ đối thủ reconnect)
    int32 grace_seconds_remaining = 8; // Số giây còn lại của thời gian ân hạn
    int32 white_elo = 9;
    int32 black_elo = 10;
}

// ==========================================
// AUTHENTICATION (Xác thực tài khoản)
// ==========================================

message AuthRequest {
    string username = 1;
    string password = 2;
}

message AuthResponse {
    bool success = 1;
    string message = 2;
    string token = 3;
    int32 elo = 4;
}

// ==========================================
// MATCHMAKING & PRIVATE ROOMS
// ==========================================

message QueueRequest {
}

enum QueueStatus {
    QUEUE_WAITING = 0;
    QUEUE_MATCHED = 1;
    QUEUE_CANCELLED = 2;
    QUEUE_ERROR = 3;
}

message QueueResponse {
    QueueStatus status = 1;
    string message = 2;
    string match_id = 3;
    string opponent_name = 4;
    int32 assigned_color = 5; // 1: White, 2: Black
    int32 rows = 6;
    int32 cols = 7;
    int32 opponent_elo = 8;
    int32 your_elo = 9;
    string room_code = 10;
}

message CreateRoomRequest {
    int32 rows = 1;
    int32 cols = 2;
}

message CreateRoomResponse {
    bool success = 1;
    string message = 2;
    string room_code = 3;
}

message JoinRoomRequest {
    string room_code = 1;
}

// ==========================================
// REJOIN & ONLINE MATCH PLAY
// ==========================================

message RejoinRequest {
    string match_id = 1;
}

message RejoinResponse {
    bool success = 1;
    string message = 2;
    string match_id = 3;
    string opponent_name = 4;
    int32 assigned_color = 5;
    int32 rows = 6;
    int32 cols = 7;
    int32 opponent_elo = 8;
    int32 your_elo = 9;
}

message OnlineAction {
    string match_id = 1;
    ClientAction action = 2;
}

// ==========================================
// SERVICE UNIFIED
// ==========================================

service GomokuService {
    // 1. Chế độ LAN P2P
    rpc PlayStream(stream ClientAction) returns (stream GameSync);

    // 2. Xác thực người dùng
    rpc Register(AuthRequest) returns (AuthResponse);
    rpc Login(AuthRequest) returns (AuthResponse);

    // 3. Ghép trận tự động (Elo Matchmaking)
    rpc QueueMatch(QueueRequest) returns (stream QueueResponse);

    // 4. Phòng riêng (Private Rooms)
    rpc CreatePrivateRoom(CreateRoomRequest) returns (CreateRoomResponse);
    rpc JoinPrivateRoom(JoinRoomRequest) returns (stream QueueResponse);

    // 5. Trận đấu trực tuyến & Phục hồi kết nối
    rpc CheckRejoin(RejoinRequest) returns (RejoinResponse);
    rpc PlayOnline(stream OnlineAction) returns (stream GameSync);
}
